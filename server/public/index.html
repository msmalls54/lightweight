<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightweight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* ---------------------------------------------------------------- tokens */
  :root {
    --bg: #0B0D10; --surface: #14171C; --line: #1F242B;
    --text: #E8EAED; --muted: #8A9099;
    --accent: #4C8DFF;                                      /* the one interactive color */
    --ok: #22C55E; --warn: #F59E0B; --bad: #EF4444;         /* verdicts only */
    --fs-s: clamp(13px, 1.3vh, 15px); --fs-m: clamp(15px, 1.6vh, 18px); --fs-l: clamp(20px, 2.2vh, 26px); /* 3 sizes */
    --fs-hero: clamp(34px, 6.2vh, 60px);                    /* + one hero size */
    --r: 14px; --s1: 8px; --s2: 16px; --s3: 24px;           /* radius, 8 px grid */
    --ease: 160ms ease;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; font-size: var(--fs-m); font-weight: 400;
    -webkit-font-smoothing: antialiased; }
  .num, #setline, .meter .verdict, .meter .mx, #feed .x, .raw .val, #devText, #hbText, #mode { font-variant-numeric: tabular-nums; }
  b, strong { font-weight: 600; }

  /* One screen: header / three columns (workout | body | coach) / toolbar. */
  body { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }

  /* ---------------------------------------------------------------- controls */
  button, input, select { font: inherit; font-size: var(--fs-s); color: var(--text); background: transparent; border: 1px solid var(--line);
    border-radius: 10px; padding: 7px 12px; transition: border-color var(--ease), background var(--ease), color var(--ease); }
  button { cursor: pointer; font-weight: 600; color: var(--text); }
  button:hover { border-color: #2C333C; background: #181C22; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.primary:hover { background: #3F7FF0; }
  button.danger, button.quiet { color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  select option { background: var(--surface); }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: var(--fs-s); }
  input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  kbd { font: inherit; font-size: 11px; font-weight: 600; padding: 1px 6px; margin-left: 6px; border-radius: 5px; border: 1px solid rgba(255,255,255,.25); color: inherit; opacity: .8; }

  /* ---------------------------------------------------------------- header: logo · one quiet status line */
  header { display: flex; align-items: center; gap: var(--s2); padding: 12px var(--s3); border-bottom: 1px solid var(--line); min-width: 0; }
  .brand { font-size: var(--fs-l); font-weight: 600; letter-spacing: -.01em; }
  .status { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: var(--fs-s); min-width: 0; white-space: nowrap; overflow: hidden; }
  .status > * { display: inline-flex; align-items: center; gap: 6px; }
  .status .sep { width: 3px; height: 3px; border-radius: 50%; background: #3A414B; }
  #mode { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #mode.replay { color: var(--warn); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #3A414B; flex: none; }
  .dot.on { background: var(--ok); }
  .dot.off { background: var(--bad); }
  #sseWrap.ok { display: none; }                         /* only shown when the link drops */
  #spk { cursor: pointer; border-radius: 8px; padding: 2px 6px; }
  #spk:hover { color: var(--text); }
  #spk.on { color: var(--text); }
  #spk svg { width: 15px; height: 15px; }
  .grow { flex: 1; }
  #who { font-size: var(--fs-m); font-weight: 600; text-align: right; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #who small { font-size: var(--fs-s); font-weight: 400; color: var(--muted); margin-left: 6px; }

  /* ---------------------------------------------------------------- cards */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s2) 20px; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  .label { flex: none; margin: 0 0 12px; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  main { display: grid; grid-template-columns: minmax(0, .82fr) minmax(0, 1.6fr) minmax(0, 1fr); gap: var(--s2); padding: var(--s2) var(--s3); min-height: 0; overflow: hidden; }

  /* ---------------------------------------------------------------- left: today's workout */
  #timeline { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: var(--s2); scrollbar-width: thin; scrollbar-color: #2C333C transparent; }
  #timeline:empty::before { content: "No sets yet today."; color: var(--muted); }
  .blk .bh { font-size: var(--fs-m); font-weight: 600; margin-bottom: 6px; }
  .blk .bh span { font-weight: 400; color: var(--muted); }
  .srow { width: 100%; display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 2px 10px; align-items: center; text-align: left; padding: 8px 10px; margin: 0 0 4px; border: 1px solid transparent; border-radius: 10px; background: transparent; font-weight: 400; font-size: var(--fs-s); color: var(--text); }
  button.srow:hover { background: #181C22; border-color: var(--line); }
  .srow.sel { border-color: #2C333C; background: #181C22; }
  .srow.live { border-color: var(--accent); }
  .srow .sn { font-weight: 600; }
  .srow .sv { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .srow .sv b { color: var(--text); font-weight: 600; }
  .srow .dots { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .srow .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
  .srow .dots i.loose { background: var(--warn); } .srow .dots i.cheat { background: var(--bad); }
  .srow.logged { color: var(--muted); }
  .srow .tagline { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

  /* ---------------------------------------------------------------- center: the body is the hero */
  #hero { position: relative; display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; gap: 12px; }
  #heroStatus { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2); min-width: 0; }
  #heroStatus .hs-left { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  #armState { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-s); font-weight: 600; color: var(--muted); }
  #armState::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #3A414B; }
  #armState.armed { color: var(--text); }
  #armState.armed::before { background: var(--accent); }
  #setline { font-size: var(--fs-hero); font-weight: 600; line-height: 1.05; letter-spacing: -.02em; white-space: nowrap; }
  #setline .counts { margin-left: 14px; font-size: var(--fs-m); font-weight: 400; letter-spacing: 0; color: var(--muted); }
  #setline .counts b { font-weight: 600; color: var(--text); }
  #setmeta { font-size: var(--fs-s); color: var(--muted); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #heroStart { display: none !important; }

  /* body stage: person's right arm meter | figure | person's left arm meter */
  #stage { position: relative; min-height: 0; display: grid; grid-template-columns: minmax(96px, .55fr) minmax(0, 1.4fr) minmax(96px, .55fr); align-items: center; gap: var(--s2); }
  #meters { display: contents; }
  #map { grid-column: 2; grid-row: 1; height: 100%; min-height: 0; display: flex; }
  #map svg { display: block; width: 100%; height: 100%; }
  .meter { grid-row: 1; height: min(100%, 360px); display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; min-width: 0; transition: opacity var(--ease); }
  .meter[data-arm="R"] { grid-column: 1; } .meter[data-arm="L"] { grid-column: 3; }
  .meter.off { opacity: .3; }
  .meter .side { font-size: var(--fs-s); font-weight: 600; color: var(--muted); }
  .meter .verdict { font-size: clamp(26px, 4.6vh, 46px); font-weight: 600; line-height: 1; letter-spacing: -.02em; color: var(--muted); transition: color var(--ease); }
  .meter .verdict .mx { display: block; margin-top: 6px; font-size: var(--fs-l); font-weight: 400; letter-spacing: 0; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meter.clean .verdict { color: var(--ok); } .meter.loose .verdict { color: var(--warn); } .meter.cheat .verdict { color: var(--bad); }
  .meter .vgauge { position: relative; flex: 1 1 0; min-height: 60px; width: 12px; border-radius: 6px; overflow: hidden; display: flex; flex-direction: column-reverse; background: #1B1F25; }
  .meter .vgauge .z { width: 100%; }
  .meter .vgauge .zg { height: 60%; background: rgba(34, 197, 94, .28); }    /* 0 - 1.2x (bottom) */
  .meter .vgauge .za { height: 7.5%; background: rgba(245, 158, 11, .35); }  /* 1.2 - 1.35x */
  .meter .vgauge .zr { flex: 1; background: rgba(239, 68, 68, .30); }       /* >= 1.35x, top = 2x */
  .meter .vgauge .mk { position: absolute; left: -2px; right: -2px; height: 4px; margin-bottom: -2px; bottom: 0; background: var(--text); border-radius: 2px; transition: bottom 200ms ease; }
  .meter .msub { font-size: var(--fs-s); color: var(--muted); max-width: 100%; }
  .meter .scale { font-size: 11px; color: var(--muted); }

  #banner { position: absolute; left: 0; right: 0; bottom: 8px; display: flex; justify-content: center; pointer-events: none; opacity: 0; transform: translateY(6px); transition: opacity var(--ease), transform var(--ease); }
  #banner.show { opacity: 1; transform: none; }
  #banner span { max-width: 92%; padding: 10px 18px; border-radius: 12px; background: rgba(20, 23, 28, .96); border: 1px solid var(--line); border-left: 4px solid var(--bad);
    font-size: var(--fs-l); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  #reviewBar { display: flex; align-items: center; gap: 12px; font-size: var(--fs-s); color: var(--muted); }
  #reviewBar input[type=range] { flex: 1; accent-color: var(--accent); padding: 0; border: 0; }
  #reviewBar b { color: var(--text); font-weight: 600; }
  #bars { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px 14px; }
  .raw { display: grid; grid-template-columns: minmax(0, 1fr) 3em; grid-template-rows: auto auto; gap: 4px 6px; align-items: center; font-size: var(--fs-s); color: var(--muted); transition: opacity var(--ease); }
  .raw .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .raw .track { grid-column: 1 / -1; grid-row: 2; position: relative; height: 5px; border-radius: 3px; background: #1B1F25; overflow: hidden; }
  .raw .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 3px; background: #4A525E; transition: width 60ms linear; }
  .raw.delt .fill { background: #6B7380; }
  .raw.hot .fill { background: var(--bad); }
  .raw .mvc { position: absolute; top: -2px; bottom: -2px; width: 1px; background: rgba(255,255,255,.35); }
  .raw .val { text-align: right; color: var(--text); }
  .raw.stale .fill { opacity: .4; }
  @keyframes pulseRed { from { fill: #EF4444; } }   /* fades back to the live shade */
  @keyframes pulseGreen { from { fill: #22C55E; } }
  #map polygon.pulse-red { animation: pulseRed 1.2s ease-out; }
  #map polygon.pulse-green { animation: pulseGreen 1.2s ease-out; }

  /* ---------------------------------------------------------------- right: coach */
  #coachCard { gap: 10px; }
  #coachCard .label { margin: 0; }
  #coachScroll { flex: 1 1 0; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scrollbar-width: thin; scrollbar-color: #2C333C transparent; }
  #sofar { font-size: var(--fs-m); line-height: 1.45; color: var(--text); }
  #sofar .tot { color: var(--muted); font-size: var(--fs-s); margin-bottom: 4px; }
  #sofar .tot .src { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  #sofar .ws-head { font-weight: 600; margin: 4px 0 6px; }
  #sofar .ws-list { margin: 0 0 8px; padding-left: 18px; }
  #sofar .ws-list li { margin: 2px 0; }
  #sofar .ws-focus { padding: 10px 12px; border-radius: 10px; background: rgba(76, 141, 255, .10); border: 1px solid rgba(76, 141, 255, .35); }
  #sofar .ws-focus b { display: block; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  #sofarTitle { display: flex; justify-content: space-between; align-items: center; }
  #sofarSpeak { display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; font-size: 11px; letter-spacing: 0; text-transform: none; }
  #sofar:empty::before { content: "Today's sets and the coach's take show up here."; color: var(--muted); }
  #reportTitle { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  #reportTitle .src { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); }
  #coach { font-size: var(--fs-l); line-height: 1.35; color: var(--text); }
  #coach:empty { display: none; }
  #report { font-size: var(--fs-m); line-height: 1.45; }
  #report:empty { display: none; }
  #report .r-head { font-weight: 600; margin-bottom: 6px; }
  #report ul { margin: 0 0 10px; padding-left: 18px; color: var(--text); }
  #report li { margin: 2px 0; }
  #report .r-cue { color: var(--text); }
  #report .r-cue b, #report .r-dec b { color: var(--muted); font-weight: 600; margin-right: 6px; }
  #report .r-dec { color: var(--muted); margin-top: 4px; }
  #feedCard { border-top: 1px solid var(--line); padding-top: 10px; }
  #feedCard summary { cursor: pointer; list-style: none; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #feedCard summary::-webkit-details-marker { display: none; }
  #feedCard summary::after { content: " +"; } #feedCard[open] summary::after { content: " −"; }
  #feed { list-style: none; margin: 8px 0 0; padding: 0; }
  #feed, #report, #coach { scrollbar-width: thin; scrollbar-color: #2C333C transparent; }
  #feed:empty::before { content: "No reps yet."; color: var(--muted); }
  #feed li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto 5.2em; align-items: center; column-gap: 10px; row-gap: 2px; padding: 10px 2px; border-bottom: 1px solid var(--line); }
  #feed li:last-child { border-bottom: 0; }
  #feed .v { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  #feed .v.loose { background: var(--warn); } #feed .v.cheat { background: var(--bad); } #feed .v.none { background: transparent; border: 1px solid #3A414B; }
  #feed .t { font-weight: 600; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #feed .t .arm { font-weight: 400; color: var(--muted); }
  #feed .x { color: var(--muted); text-align: right; }
  #feed .w { font-size: var(--fs-s); font-weight: 600; text-align: right; color: var(--ok); }
  #feed .w.loose { color: var(--warn); } #feed .w.cheat { color: var(--bad); } #feed .w.none { color: var(--muted); font-weight: 400; }
  #feed .d { grid-column: 2 / -1; font-size: var(--fs-s); color: var(--muted); }
  #feed li.setend .t { color: var(--muted); font-weight: 400; }
  #feed li.fresh { animation: fadeIn 180ms ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---------------------------------------------------------------- toolbar */
  footer { display: flex; flex-wrap: wrap; align-items: center; gap: 10px var(--s2); padding: 12px var(--s3) 14px; border-top: 1px solid var(--line); }
  .grp { display: flex; gap: var(--s1); align-items: center; flex-wrap: wrap; }
  footer > .grp + .grp { padding-left: var(--s2); border-left: 1px solid var(--line); }
  .grp > .gl { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-right: 2px; }
  #exercise { width: 120px; } #load { width: 60px; } #replaySel { max-width: 220px; } #musicFiles { max-width: 190px; color: var(--muted); }
  audio { height: 30px; max-width: 220px; }
  .more { position: relative; }
  .more summary { list-style: none; cursor: pointer; font-size: var(--fs-s); font-weight: 600; color: var(--muted); padding: 7px 12px; border: 1px solid var(--line); border-radius: 10px; }
  .more summary::-webkit-details-marker { display: none; }
  .more[open] summary, .more summary:hover { color: var(--text); }
  .more-pop { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 6; display: flex; flex-direction: column; gap: 12px; padding: var(--s2); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; white-space: nowrap; }
  .more-pop .grp + .grp { padding-left: 0; border-left: 0; }
  .hidden { display: none !important; }
  button.big { font-size: var(--fs-m); padding: 10px 18px; border-radius: 12px; }
  .sayhint { font-weight: 400; opacity: .8; margin-left: 10px; }
  footer:not(.voice) .sayhint { display: none; }
  .np { color: var(--muted); font-size: var(--fs-s); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-flex; align-items: center; gap: 6px; }
  .more summary { display: inline-flex; align-items: center; gap: 8px; }
  #settings .more-pop { min-width: 560px; }
  #audioOut { max-width: 260px; }
  .warnline { color: var(--warn); font-size: var(--fs-s); white-space: normal; max-width: 420px; }
  #coachOut.warn { color: var(--warn); }
  #quietBtn { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  #quietBtn.on { color: var(--warn); border-color: var(--warn); }
  #quietBtn.on span::after { content: " on"; }
  #mic { display: inline-flex; align-items: center; gap: 6px; }
  #mic.listening { color: var(--text); }
  #mic.listening::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  #mic.heard { color: var(--text); }
  .more-pop .gl { width: 56px; }


  /* ---------------------------------------------------------------- overlays */
  #cal, #cd { position: fixed; inset: 0; background: rgba(11, 13, 16, .94); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: var(--s3); }
  #cal { z-index: 10; } #cd { z-index: 9; }
  #cal.show, #cd.show { display: flex; }
  #calStep { color: var(--muted); font-size: var(--fs-s); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; }
  #calTitle { font-size: var(--fs-hero); font-weight: 600; margin: 12px 0; letter-spacing: -.02em; }
  #calTitle.go { color: var(--accent); }
  #calHint { font-size: var(--fs-l); color: var(--muted); min-height: 28px; }
  #calCount, #cdText { font-size: clamp(80px, 20vh, 180px); font-weight: 600; line-height: 1; color: var(--text); font-variant-numeric: tabular-nums; min-height: 1em; letter-spacing: -.03em; }
  #calCount { margin: var(--s2) 0; }
  #cdText.go { color: var(--ok); }
  #cdSub { font-size: var(--fs-l); color: var(--muted); margin-top: var(--s2); }
  #calResult { font-size: var(--fs-m); line-height: 1.6; max-width: 900px; color: var(--muted); }
  #calResult .bad { color: var(--bad); } #calResult .good { color: var(--text); }
  #toast { position: fixed; right: var(--s3); bottom: 76px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; font-size: var(--fs-s); display: none; z-index: 11; max-width: 420px; }
  #toast.show { display: block; }

  /* Narrow or short windows: stack and scroll instead of squeezing. */
  @media (max-width: 1000px), (max-height: 620px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    main { grid-template-columns: minmax(0, 1fr); overflow: visible; }
    #hero { order: -1; height: 560px; }
    main > .card { min-height: 320px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div class="brand">Lightweight</div>
  <div class="status">
    <span id="mode">Live</span><span class="sep"></span>
    <span><span class="dot" id="devDot"></span><span id="devText">No device</span></span><span class="sep"></span>
    <span id="hbText">No heartbeat</span>
    <span id="sseWrap"><span class="sep"></span><span class="dot" id="sseDot"></span><span id="sseText">Connecting</span></span>
    <span class="sep"></span><span id="spk" role="button" tabindex="0">Voice</span>
    <span id="micWrap" class="hidden"><span class="sep"></span><span id="mic"></span></span>
    <span class="sep"></span><span id="coachOut" title="Where the coach's voice plays (Settings → Coach audio)">Coach → System default</span>
  </div>
  <button id="quietBtn" title="Quiet mode: no audio on any dashboard (Q)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/></svg><span>Quiet</span><kbd>Q</kbd></button>
  <span class="grow"></span>
  <span id="who">No session</span>
</header>
<main>
  <section class="card" id="timelineCard">
    <div class="label">Today's workout</div>
    <div id="timeline"></div>
  </section>

  <section class="card" id="hero">
    <div id="heroStatus">
      <div class="hs-left">
        <div id="armState" class="idle">Idle</div>
        <div id="setline">Ready</div>
      </div>
      <div id="setmeta"></div>
      <button id="heroStart" class="primary">Start set</button>
    </div>
    <div id="stage">
      <div id="meters"></div>
      <div id="map"></div>
      <div id="banner"><span id="bannerText"></span></div>
    </div>
    <div id="reviewBar" class="hidden"><span id="reviewText"></span><input type="range" id="reviewScrub" min="0" max="0" value="0" aria-label="Rep"><button id="reviewBack" class="quiet">Back to live</button></div>
    <div id="bars"></div>
  </section>

  <section class="card" id="coachCard">
    <div id="coachScroll">
      <div><div class="label" id="sofarTitle" style="margin-bottom:8px"><span>Workout so far</span><button id="sofarSpeak" class="quiet hidden" title="Read the workout summary aloud (or say &quot;how's my workout&quot;)"><svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6h2l3-2.5v9L4.5 10h-2z"/><path d="M10.5 5.5a3.5 3.5 0 0 1 0 5"/></svg>Read aloud</button></div><div id="sofar"></div></div>
      <div>
        <div class="label" id="reportTitle" style="margin-bottom:8px"><span id="reportName">Set report</span><span class="src" id="reportSrc"></span></div>
        <div id="coach"></div>
        <div id="report"></div>
      </div>
      <details id="feedCard"><summary>Reps · <span id="feedCount">0</span></summary><ul id="feed"></ul></details>
    </div>
  </section>
</main>

<footer>
  <span id="nowPlaying" class="np"></span>
  <span class="grow"></span>
  <button id="btnStart" class="primary big">Start set<span class="sayhint">or say "start set"</span><kbd>Space</kbd></button>
  <button id="btnStop" class="big hidden">Stop<kbd>X</kbd></button>
  <details class="more" id="settings">
    <summary title="Settings"><svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M3.6 12.4l1.1-1.1M11.3 4.7l1.1-1.1"/></svg><span>Settings</span></summary>
    <div class="more-pop">
      <div class="grp"><span class="gl">Session</span>
        <button id="btnNew">New session (Mike)</button>
        <button id="btnWalkup">Walk-up</button>
        <label><input type="checkbox" id="armR" checked> R arm</label>
        <label><input type="checkbox" id="armL" checked> L arm</label>
      </div>
      <div class="grp"><span class="gl">Set</span>
        <input id="exercise" value="dumbbell curl" aria-label="Exercise">
        <select id="variant" aria-label="Variant"><option>standing</option><option>preacher</option><option>hammer</option></select>
        <input id="load" type="number" value="35" min="0" step="5" aria-label="Load lb"><label>lb</label>
      </div>
      <div class="grp"><span class="gl">Flow</span>
        <label title="After a set ends and the coach is done, wait 20 s, then count down the next set. Any key cancels."><input type="checkbox" id="handsFree" checked> Hands-free loop</label>
        <label title="Re-arm a new set automatically after each set ends (old behaviour)."><input type="checkbox" id="autoNext"> Auto next</label>
        <button id="btnCal">Calibrate<kbd>C</kbd></button>
      </div>
      <div class="grp"><span class="gl">Replay</span>
        <select id="replaySel" aria-label="Session to replay"></select>
        <button id="btnReplay">Replay</button>
        <button id="btnReplayStop" class="danger">Stop</button>
      </div>
      <div class="grp"><span class="gl">Output</span>
        <label for="audioOut">Coach audio</label>
        <select id="audioOut" aria-label="Coach audio output"><option value="">System default</option></select>
        <button id="testVoice">Test voice</button>
        <span id="audioWarn" class="warnline hidden"></span>
      </div>
      <div class="grp"><span class="gl">Music</span>
        <input type="file" id="musicFiles" accept="audio/*" multiple aria-label="Music files">
        <audio id="music" controls></audio>
      </div>
    </div>
  </details>
</footer>

<div id="cal">
  <div id="calStep"></div>
  <div id="calTitle"></div>
  <div id="calHint"></div>
  <div id="calCount"></div>
  <div id="calResult"></div>
  <p><button id="calCancel" class="danger">Cancel</button> <button id="calClose" style="display:none" class="primary">Done</button></p>
</div>
<div id="toast"></div>
<div id="cd"><div id="cdText"></div><div id="cdSub"></div><p><button id="cdCancel">Cancel<kbd>X</kbd></button></p></div>

<script src="/voice-player.js" onerror="window.__lwNoVoice = true"></script>
<script src="/app.js"></script>
</body>
</html>
