<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightweight</title>
<style>
  :root {
    --bg: #0b0d12; --panel: #151922; --panel2: #1c212c; --line: #2a3140; --text: #f2f4f8; --dim: #8a93a6;
    --red: #ff3b3b; --green: #2fd67b; --amber: #ffb020; --blue: #4aa3ff; --bi: #4aa3ff; --delt: #ff8a3d;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  /* One screen, no page scroll: header / banner / panels (shrink to fit) / controls. */
  body { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; overflow: hidden; }
  button, input, select { font: inherit; color: var(--text); background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover { border-color: var(--dim); }
  button.primary { background: #23406a; border-color: var(--blue); }
  button.danger { background: #4a1c1c; border-color: var(--red); }
  button:disabled { opacity: .45; cursor: default; }

  header { display: flex; align-items: center; gap: 12px 18px; padding: 10px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-size: clamp(22px, 2.2vw, 30px); font-weight: 800; letter-spacing: .08em; }
  .pill { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-size: clamp(14px, 1.2vw, 18px); white-space: nowrap; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); }
  .dot.on { background: var(--green); box-shadow: 0 0 10px var(--green); }
  .dot.warn { background: var(--amber); }
  .dot.off { background: var(--red); }
  .mode { font-weight: 800; letter-spacing: .1em; }
  .mode.replay { background: #3b2a00; border-color: var(--amber); color: var(--amber); }
  .grow { flex: 1; }
  .pill.speaker { cursor: pointer; }
  .pill.speaker.on { border-color: var(--green); color: var(--green); }
  .who { font-size: 22px; font-weight: 700; }
  .who small { color: var(--dim); font-weight: 400; font-size: 16px; }

  #banner { height: 0; overflow: hidden; transition: height .15s; background: var(--red); color: #fff; text-align: center; font-weight: 900; letter-spacing: .04em; }
  #banner.show { height: clamp(64px, 10vh, 96px); }
  #banner span { display: block; font-size: clamp(26px, min(6vh, 3.3vw), 64px); line-height: clamp(64px, 10vh, 96px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  main { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; padding: 14px 20px; min-height: 0; overflow: hidden; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; }
  .card h2 { flex: none; margin: 0 0 8px; font-size: 16px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); font-weight: 700; }

  #map { flex: 1 1 0; min-height: 0; display: flex; }
  #map svg { display: block; width: 100%; height: 100%; }
  .maplegend { flex: none; display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; color: var(--dim); font-size: 15px; margin-top: 6px; }

  #setline { flex: none; font-size: clamp(22px, 3.4vh, 36px); font-weight: 800; margin-bottom: 2px; line-height: 1.15; }
  #setline .cnt-clean { color: var(--green); } #setline .cnt-cheat { color: var(--red); }
  .armstate { flex: none; align-self: flex-start; margin-bottom: 8px; padding: 6px 16px; border-radius: 999px; font-weight: 900; letter-spacing: .08em; font-size: clamp(16px, 2.4vh, 24px); border: 2px solid var(--line); color: var(--dim); }
  .armstate.armed { color: #06240f; background: var(--green); border-color: var(--green); box-shadow: 0 0 18px #2fd67b66; }
  .armstate.idle { background: var(--panel2); }
  #setmeta { flex: none; color: var(--dim); font-size: clamp(14px, 1.9vh, 18px); margin-bottom: 8px; }
  /* Cheat meter: per arm, the last rep's up-phase shoulder help vs that arm's clean reference. */
  #meters { flex: none; display: grid; gap: 10px; margin-bottom: 10px; }
  .meter { display: grid; grid-template-columns: clamp(64px, 7vw, 96px) minmax(0, 1fr) clamp(110px, 13vw, 190px); align-items: center; gap: 12px; padding: 8px 12px; border-radius: 12px; background: var(--panel2); border: 2px solid var(--line); }
  .meter.cheat { border-color: var(--red); background: #2a1515; }
  .meter.loose { border-color: var(--amber); }
  .meter.clean { border-color: var(--green); }
  .meter.off { opacity: .35; }
  .meter .side { font-size: clamp(16px, 2.4vh, 24px); font-weight: 900; letter-spacing: .06em; }
  .meter .gauge { position: relative; height: clamp(26px, 4.4vh, 42px); border-radius: 8px; overflow: hidden; display: flex; }
  .meter .gauge .z { height: 100%; }
  .meter .gauge .zg { background: #1d5a36; width: 60%; }      /* 0 - 1.2x */
  .meter .gauge .za { background: #6b5113; width: 7.5%; }     /* 1.2 - 1.35x */
  .meter .gauge .zr { background: #6b1d1d; flex: 1; }         /* >= 1.35x, scale ends at 2x */
  .meter .gauge .mk { position: absolute; top: 0; bottom: 0; width: 6px; margin-left: -3px; background: #fff; border-radius: 3px; box-shadow: 0 0 10px #fff; transition: left .25s; }
  .meter .gauge .mv { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 900; font-size: clamp(14px, 2.2vh, 20px); color: #fff; text-shadow: 0 0 6px #000; white-space: nowrap; }
  .meter .gauge .learn { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(13px, 1.9vh, 18px); color: #fff; background: #0e1118cc; }
  .meter .verdict { font-size: clamp(22px, 4vh, 40px); font-weight: 900; letter-spacing: .04em; text-align: right; line-height: 1; }
  .meter .verdict small { display: block; font-size: clamp(11px, 1.5vh, 14px); font-weight: 600; color: var(--dim); letter-spacing: 0; margin-top: 4px; }
  .meter.cheat .verdict { color: var(--red); } .meter.loose .verdict { color: var(--amber); } .meter.clean .verdict { color: var(--green); }
  .meter .scale { grid-column: 2; display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-top: -6px; }
  .rawhead { flex: none; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin-bottom: 4px; }
  #bars { flex: 1 1 0; min-height: 64px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
  #bars .bar .val { font-size: clamp(16px, 2.2vh, 24px); }
  #bars .bar .lbl { font-size: clamp(12px, 1.6vh, 16px); }
  /* Muscle-map pulse on each rep: front delt red on a cheat, biceps green on a clean rep. */
  @keyframes pulseRed { 0%, 40%, 80% { fill: #ff2d2d; stroke: #fff; } 20%, 60%, 100% { fill: #7a1414; } }
  @keyframes pulseGreen { 0%, 40%, 80% { fill: #2fd67b; stroke: #fff; } 20%, 60%, 100% { fill: #1d5a36; } }
  #map polygon.pulse-red { animation: pulseRed 1.6s ease-in-out; stroke-width: 1.2; }
  #map polygon.pulse-green { animation: pulseGreen 1.6s ease-in-out; stroke-width: 1.2; }
  .bar { display: flex; flex-direction: column; align-items: center; gap: 6px; min-height: 0; min-width: 0; }
  .bar .val { flex: none; font-size: clamp(22px, 3.4vh, 34px); font-weight: 800; font-variant-numeric: tabular-nums; }
  .bar .track { position: relative; flex: 1 1 0; min-height: 0; width: 100%; max-width: 110px; background: #0e1118; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .bar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 8px 8px 0 0; transition: height .06s linear; }
  .bar.bi .fill { background: linear-gradient(to top, #1d5fa8, var(--bi)); }
  .bar.delt .fill { background: linear-gradient(to top, #a8501d, var(--delt)); }
  .bar.hot .fill { background: linear-gradient(to top, #a81d1d, var(--red)); }
  .bar .mvc { position: absolute; left: 0; right: 0; border-top: 2px dashed #ffffff55; }
  .bar .mvc::after { content: "MVC"; position: absolute; right: 4px; top: -18px; font-size: 11px; color: #ffffff88; }
  .bar .lbl { flex: none; font-size: clamp(15px, 2.1vh, 20px); font-weight: 700; text-align: center; line-height: 1.1; }
  .bar .lbl small { display: block; color: var(--dim); font-weight: 400; font-size: clamp(11px, 1.5vh, 14px); }
  .stale .fill { opacity: .35; }

  #coach { flex: none; margin-top: 12px; padding: 10px 14px; background: var(--panel2); border-radius: 10px; font-size: clamp(14px, 2vh, 20px); line-height: 1.25; max-height: 22%; overflow-y: auto; border-left: 4px solid var(--blue); }
  #coach:empty::before { content: "Coach line appears after each set."; color: var(--dim); font-size: 17px; }

  #feed { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  #feed li { padding: 10px 14px; border-radius: 10px; background: var(--panel2); border-left: 6px solid var(--green); display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; }
  #feed li.cheat { border-left-color: var(--red); background: #2a1515; }
  #feed li.setend { border-left-color: var(--blue); background: #15202e; }
  #feed .t { font-size: clamp(17px, 2.3vh, 22px); font-weight: 800; }
  #feed .tag { font-size: clamp(15px, 2.1vh, 20px); font-weight: 800; color: var(--green); text-align: right; }
  #feed li.cheat .tag { color: var(--red); }
  #feed li.loose { border-left-color: var(--amber); }
  #feed .tag.loose { color: var(--amber); }
  #feed .d { grid-column: 1 / -1; color: var(--dim); font-size: clamp(13px, 1.7vh, 16px); }
  #feed li.fresh { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(1.04); filter: brightness(1.6); } to { transform: none; filter: none; } }

  footer { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 8px 20px 10px; background: var(--bg); border-top: 1px solid var(--line); align-items: center; font-size: 15px; }
  footer button, footer input, footer select { padding: 6px 10px; }
  .grp { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grp > b { color: var(--dim); text-transform: uppercase; font-size: 13px; letter-spacing: .1em; margin-right: 2px; }
  .grp label { display: inline-flex; gap: 4px; align-items: center; }
  input[type=number] { width: 80px; }
  #exercise { width: 140px; }
  input[type=number]#load { width: 64px; }
  #replaySel { max-width: 260px; }
  #musicFiles { max-width: 200px; }
  audio { height: 32px; max-width: 220px; }

  #cal { position: fixed; inset: 0; background: #07090dee; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 10; text-align: center; padding: 24px; }
  #cal.show { display: flex; }
  #calStep { color: var(--dim); font-size: 24px; letter-spacing: .1em; text-transform: uppercase; }
  #calTitle { font-size: 88px; font-weight: 900; margin: 10px 0; line-height: 1.05; }
  #calHint { font-size: 28px; color: var(--dim); min-height: 40px; }
  #calCount { font-size: 160px; font-weight: 900; font-variant-numeric: tabular-nums; color: var(--blue); min-height: 190px; }
  #calTitle.go { color: var(--red); }
  #calResult { font-size: 26px; max-width: 900px; }
  #calResult .bad { color: var(--red); }
  #calResult .good { color: var(--green); }
  #toast { position: fixed; right: 22px; top: 70px; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; font-size: 18px; display: none; z-index: 5; max-width: 480px; }
  #toast.show { display: block; }
  #cd { position: fixed; inset: 0; background: #07090de0; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 9; text-align: center; }
  #cd.show { display: flex; }
  #cdText { font-size: clamp(64px, 18vh, 200px); font-weight: 900; line-height: 1; color: var(--blue); font-variant-numeric: tabular-nums; }
  #cdText.go { color: var(--green); }
  #cdSub { font-size: clamp(20px, 3.5vh, 34px); color: var(--dim); margin-top: 16px; }
  /* Narrow windows: stack and let the page scroll instead of squeezing. */
  @media (max-width: 1000px), (max-height: 620px) {
    body { height: auto; min-height: 100vh; overflow: auto; }
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); overflow: visible; }
    main > .card { height: 460px; }
    #feedCard { grid-column: 1 / -1; height: 360px; }
  }
  .idle-note { color: var(--dim); font-size: 0.8em; font-weight: 600; }
</style>
</head>
<body>
<header>
  <div class="brand">LIGHTWEIGHT</div>
  <span class="pill mode" id="mode">LIVE</span>
  <span class="pill"><span class="dot" id="devDot"></span><span id="devText">No device</span></span>
  <span class="pill" id="hbText">Heartbeat: none</span>
  <span class="pill"><span class="dot" id="sseDot"></span><span id="sseText">Dashboard link</span></span>
  <span class="pill" id="spk" role="button" tabindex="0">🔇 …</span>
  <span class="grow"></span>
  <span class="who" id="who">No session</span>
</header>
<div id="banner"><span id="bannerText"></span></div>

<main>
  <section class="card">
    <h2>Muscle map</h2>
    <div id="map"></div>
    <div class="maplegend"><span>◀ Right arm</span><span>Gray = not measured</span><span>Left arm ▶</span></div>
  </section>

  <section class="card">
    <div id="armState" class="armstate idle">IDLE · press Start set (S)</div>
    <div id="setline">Ready</div>
    <div id="setmeta">Start a set or just curl.</div>
    <div id="meters"></div>
    <div class="rawhead">Raw effort (%MVC)</div>
    <div id="bars"></div>
    <div id="coach"></div>
  </section>

  <section class="card" id="feedCard">
    <h2>Reps</h2>
    <ul id="feed"></ul>
  </section>
</main>

<footer>
  <div class="grp"><b>Session</b>
    <button id="btnNew">New session (Mike)</button>
    <button id="btnWalkup">Walk-up…</button>
    <label><input type="checkbox" id="armR" checked> R arm</label>
    <label><input type="checkbox" id="armL" checked> L arm</label>
  </div>
  <div class="grp"><b>Calibrate</b>
    <button id="btnCal">Calibrate (C) · optional</button>
  </div>
  <div class="grp"><b>Set</b>
    <input id="exercise" value="dumbbell curl" aria-label="Exercise">
    <select id="variant" aria-label="Variant"><option>standing</option><option>preacher</option><option>hammer</option></select>
    <input id="load" type="number" value="35" min="0" step="5" aria-label="Load lb"> lb
    <label><input type="checkbox" id="autoNext"> auto next</label>
    <label title="After a set ends and the coach is done, wait 20 s, then count down the next set. Any key cancels."><input type="checkbox" id="handsFree" checked> hands-free loop</label>
    <button id="btnStart" class="primary">Start set (S / Space)</button>
    <button id="btnStop">Stop set (X)</button>
  </div>
  <div class="grp"><b>Replay</b>
    <select id="replaySel" aria-label="Session to replay"></select>
    <button id="btnReplay">Replay</button>
    <button id="btnReplayStop" class="danger">Stop</button>
  </div>
  <div class="grp"><b>Music</b>
    <input type="file" id="musicFiles" accept="audio/*" multiple aria-label="Music files">
    <audio id="music" controls></audio>
  </div>
</footer>

<div id="cal">
  <div id="calStep"></div>
  <div id="calTitle"></div>
  <div id="calHint"></div>
  <div id="calCount"></div>
  <div id="calResult"></div>
  <p><button id="calCancel" class="danger">Cancel</button> <button id="calClose" style="display:none" class="primary">Done</button></p>
</div>
<div id="toast"></div>
<div id="cd"><div id="cdText"></div><div id="cdSub"></div><p><button id="cdCancel" class="danger">Cancel (X)</button></p></div>

<script src="/voice-player.js" onerror="window.__lwNoVoice = true"></script>
<script src="/app.js"></script>
</body>
</html>
